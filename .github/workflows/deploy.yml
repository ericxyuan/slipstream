name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Record source revision
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git show --no-patch --format=raw "$REVISION"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec wrangler deploy --dry-run
      - name: Exercise two multiplayer clients
        run: |
          pnpm exec wrangler dev --local --port 8788 > "$RUNNER_TEMP/slipstream.log" 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://localhost:8788/api/health; then break; fi
            sleep 1
          done
          pnpm smoke:party http://localhost:8788
      - name: Package preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: slipstream-preview
          path: dist/
      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production party racing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm smoke:party https://slipstream.ericxyuan.workers.dev
